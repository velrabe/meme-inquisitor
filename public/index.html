<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meme Inquisitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas для игры -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI элементы -->
    <div id="ui">
        <div id="rankSection" class="rank-section">
            <div class="rank-header">
                <span class="rank-label">RANK:</span>
                <span id="rankValue" class="rank-value">1</span>
            </div>
            <div id="rankStars" class="rank-stars">
                ⭐⭐⭐⭐⭐
            </div>
            <div class="rank-xp">
                <span class="xp-label">XP:</span>
                <span id="rankXP" class="xp-value">0 / 1,000</span>
            </div>
        </div>
        <div id="level">Level: <span id="levelValue">1</span></div>
        <div id="coins">💰 <span id="coinsValue">0</span></div>
    </div>

    <!-- Кнопка паузы (внутри игровой области) -->
    <div id="gameUI">
        <button id="pauseBtn" class="pause-button">⏸</button>
    </div>

    <!-- Кнопка сброса GamePush -->
    <div id="debugButtons">
        <button id="resetGPBtn">Сброс</button>
    </div>

    <!-- Мобильные стрелки управления -->
    <div id="mobileControls">
        <button id="leftArrow" class="control-arrow left">◀</button>
        <button id="rightArrow" class="control-arrow right">▶</button>
    </div>

    <!-- Экран проигрыша -->
    <div id="loseScreen" class="screen hidden">
        <h1>Game Over</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Best: <span id="finalBest">0</span></p>
        <button id="restartBtn">Restart</button>
    </div>

    <!-- Модальное окно паузы -->
    <div id="pauseModal" class="modal hidden">
        <div class="modal-content">
            <h2>Пауза</h2>
            <div class="modal-buttons">
                <button id="resumeBtn" class="modal-btn resume">Продолжить</button>
                <button id="restartFromPauseBtn" class="modal-btn restart">Начать с 1 уровня</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно повышения уровня -->
    <div id="levelUpModal" class="modal hidden">
        <div class="modal-content level-up">
            <h2>🎉 Поздравляем!</h2>
            <p id="levelUpText">Уровень 1 пройден!</p>
            <div class="modal-buttons">
                <button id="continueBtn" class="modal-btn continue">Продолжить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно магазина -->
    <div id="shopModal" class="modal hidden">
        <div class="modal-content shop-content">
            <div class="shop-header">
                <h2>🛒 Магазин</h2>
                <div class="shop-coins">💰 <span id="shopCoinsValue">0</span></div>
            </div>
            <div id="shopItems" class="shop-items">
                <!-- Предметы добавляются динамически -->
            </div>
            <div class="modal-buttons">
                <button id="closeShopBtn" class="modal-btn resume">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Кнопка магазина (справа снизу) -->
    <button id="shopBtn" class="shop-button">🛒</button>

    <!-- Купленные апгрейды (слева снизу) -->
    <div id="purchasedUpgrades" class="purchased-upgrades"></div>

    <!-- Модальное окно статистики -->
    <div id="statsModal" class="modal hidden">
        <div class="modal-content stats-content">
            <h2>📊 Статистика</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Ранг</div>
                    <div class="stat-value" id="statsRank">1</div>
                    <div class="stat-title" id="statsTitle">Novice</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Общий XP</div>
                    <div class="stat-value" id="statsTotalXP">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Убийств</div>
                    <div class="stat-value" id="statsKills">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Смертей</div>
                    <div class="stat-value" id="statsDeaths">0</div>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="closeStatsBtn" class="modal-btn resume">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Уведомление о повышении ранга -->
    <div id="rankUpNotification" class="rank-up-notification hidden">
        <div class="rank-up-content">
            <div class="rank-up-flash">✨</div>
            <div class="rank-up-text">+1 RANK</div>
            <div class="rank-up-title" id="rankUpTitle">Hunter</div>
        </div>
    </div>

    <!-- GamePush SDK -->
    <script async src="https://gamepush.com/sdk/gamepush.js?projectId=24834&publicToken=ci5ET6SIXsl2ahQfp03ZxrdhlZ75eIwN&callback=onGPInit"></script>
    <script>
        window.onGPInit = async function (gp) {
            window.gp = gp;
            window.GP = gp; // Для обратной совместимости
            console.log('GamePush initialized');
            
            // КРИТИЧЕСКИ ВАЖНО: ждем готовности player
            try {
                await gp.player.ready;
                console.log('GamePush player ready');
            } catch (err) {
                console.error('GamePush player ready failed:', err);
            }
            
            // Уведомляем о готовности GamePush
            window.dispatchEvent(new CustomEvent('gamepushReady'));
        }
    </script>

    <!-- Игровые модули -->
    <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
